<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — TaskHive</title>
<link rel="icon" href="TH.ico">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-3">
      <img src="TaskHiveLogo.png" alt="TaskHive" onerror="this.style.display='none'">
      <h2 class="mb-0">TaskHive</h2>
      <div class="text-muted small">Organize the swarm.</div>
    </div>
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="alert alert-danger py-2 d-none" id="login-error"></div>
      <button type="submit" class="btn btn-primary w-100" id="login-btn">
        <span id="login-btn-text">Log In</span>
        <span id="login-spinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
      </button>
    </form>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  if (TaskHiveAuth.isLoggedIn()) window.location.href = 'pages/dashboard.html';
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('login-error');
    errEl.classList.add('d-none');
    document.getElementById('login-btn').disabled = true;
    document.getElementById('login-btn-text').textContent = 'Logging in...';
    document.getElementById('login-spinner').classList.remove('d-none');
    const res = await TaskHiveAuth.login(document.getElementById('username').value.trim(), document.getElementById('password').value);
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn-text').textContent = 'Log In';
    document.getElementById('login-spinner').classList.add('d-none');
    if (res.success) window.location.href = 'pages/dashboard.html';
    else { errEl.textContent = res.error || 'Login failed.'; errEl.classList.remove('d-none'); }
  });
</script>
</body>
</html>
