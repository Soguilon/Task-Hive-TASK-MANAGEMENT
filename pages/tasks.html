<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks — TaskHive</title>
<link rel="icon" href="../TH.ico">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="th-shell">
  <aside class="th-sidebar" id="th-sidebar"></aside>
  <div class="sidebar-overlay" id="th-overlay"></div>
  <div class="th-main">
    <header class="th-topbar" id="th-topbar"></header>
    <main class="th-content">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="fa-solid fa-list-check"></i> <span id="page-title">Tasks</span></h3>
        <button class="btn btn-primary d-none" id="new-task-btn"><i class="fa-solid fa-plus"></i> New Task</button>
      </div>
      <div class="table-responsive card p-0">
        <table class="table-brut mb-0">
          <thead><tr><th>Title</th><th>Assigned</th><th>Priority</th><th>Status</th><th>Progress</th><th>Deadline</th><th>Actions</th></tr></thead>
          <tbody id="tasks-tbody"></tbody>
        </table>
      </div>
      <div id="tasks-empty" class="empty-state d-none"><i class="fa-solid fa-list-check"></i>No tasks found.</div>
    </main>
  </div>
</div>

<div class="modal fade" id="task-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="task-form">
        <div class="modal-header"><h5 class="modal-title" id="task-modal-title">New Task</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="tf-task-id">
          <div class="mb-3"><label class="form-label">Task Title *</label><input class="form-control" id="tf-title" required></div>
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">Assigned Member *</label><select class="form-select" id="tf-member" required></select></div>
          </div>
          <div class="mb-3"><label class="form-label">Description (one item per line)</label><textarea class="form-control" id="tf-desc" rows="3"></textarea></div>
          <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label">Priority</label><select class="form-select" id="tf-priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
            <div class="col-md-4"><label class="form-label">Deadline</label><input type="date" class="form-control" id="tf-deadline"></div>
            <div class="col-md-4"><label class="form-label">Progress (%)</label><input type="number" min="0" max="100" class="form-control" id="tf-progress" value="0"></div>
          </div>
          <div class="mb-2"><label class="form-label">Links / Resources</label></div>
          <div id="tf-links-container"></div>
          <button type="button" class="btn btn-outline-brut btn-sm" id="tf-add-link"><i class="fa-solid fa-plus"></i> Add Another Link</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-brut" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-honey" id="tf-submit-btn">Create Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="task-detail-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content" id="task-detail-content"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/tasks.js"></script>
</body>
</html>
