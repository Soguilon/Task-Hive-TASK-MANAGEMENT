<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings — TaskHive</title>
<link rel="icon" href="../TH.ico">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="th-shell">
  <aside class="th-sidebar" id="th-sidebar"></aside>
  <div class="sidebar-overlay" id="th-overlay"></div>
  <div class="th-main">
    <header class="th-topbar" id="th-topbar"></header>
    <main class="th-content">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="fa-solid fa-handshake"></i> Meetings</h3>
        <button class="btn btn-primary d-none" id="new-meeting-btn"><i class="fa-solid fa-plus"></i> New Meeting</button>
      </div>
      <div class="row g-3" id="meetings-list"></div>
    </main>
  </div>
</div>

<div class="modal fade" id="meeting-modal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
  <form id="meeting-form">
    <div class="modal-header"><h5 class="modal-title" id="meeting-modal-title">New Meeting</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="mf-meeting-id">
      <div class="mb-3"><label class="form-label">Title *</label><input class="form-control" id="mf-title" required></div>
      <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="mf-desc" rows="2"></textarea></div>
      <div class="row g-2 mb-3">
        <div class="col-md-6"><label class="form-label">Date *</label><input type="date" class="form-control" id="mf-date" required></div>
        <div class="col-md-6"><label class="form-label">Time</label><input type="time" class="form-control" id="mf-time"></div>
      </div>
      <div class="mb-3"><label class="form-label">Status</label><select class="form-select" id="mf-status"><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select></div>
      <div class="mb-3"><label class="form-label">Participants</label><select class="form-select" id="mf-participants" multiple size="4"></select></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-danger d-none" id="mf-delete-btn">Delete</button>
      <button type="button" class="btn btn-outline-brut" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-honey">Save</button>
    </div>
  </form>
</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/meetings.js"></script>
</body>
</html>
