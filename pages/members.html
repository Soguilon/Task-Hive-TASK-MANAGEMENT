<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members — TaskHive</title>
<link rel="icon" href="../TH.ico">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="th-shell">
  <aside class="th-sidebar" id="th-sidebar"></aside>
  <div class="sidebar-overlay" id="th-overlay"></div>
  <div class="th-main">
    <header class="th-topbar" id="th-topbar"></header>
    <main class="th-content">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="fa-solid fa-users"></i> Members</h3>
        <button class="btn btn-primary" id="new-member-btn"><i class="fa-solid fa-user-plus"></i> Add Member</button>
      </div>
      <div class="table-responsive card p-0">
        <table class="table-brut mb-0">
          <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="members-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="member-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <form id="member-form">
      <div class="modal-header"><h5 class="modal-title" id="member-modal-title">Add Member</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="mf-user-id">
        <div class="mb-3"><label class="form-label">Display Name *</label><input class="form-control" id="mf-display-name" required></div>
        <div class="mb-3"><label class="form-label">Username *</label><input class="form-control" id="mf-username" required></div>
        <div class="mb-3"><label class="form-label">Password <span id="mf-pass-note" class="text-muted small">(leave blank to keep unchanged)</span></label><input type="password" class="form-control" id="mf-password"></div>
        <div class="mb-3"><label class="form-label">Role</label><select class="form-select" id="mf-role"><option value="Member">Member</option><option value="Admin">Admin</option></select></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-brut" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-honey">Save</button></div>
    </form>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/members.js"></script>
</body>
</html>
