<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Notes — TaskHive</title>
<link rel="icon" href="../TH.ico">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="th-shell">
  <aside class="th-sidebar" id="th-sidebar"></aside>
  <div class="sidebar-overlay" id="th-overlay"></div>
  <div class="th-main">
    <header class="th-topbar" id="th-topbar"></header>
    <main class="th-content">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="fa-solid fa-note-sticky"></i> My Notes</h3>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" id="notes-search" placeholder="Search notes...">
          <button class="btn btn-primary btn-sm" id="new-note-btn"><i class="fa-solid fa-plus"></i> New Note</button>
        </div>
      </div>
      <div class="row g-3" id="notes-list"></div>
    </main>
  </div>
</div>

<div class="modal fade" id="note-modal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
  <form id="note-form">
    <div class="modal-header"><h5 class="modal-title" id="note-modal-title">New Note</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="nf-note-id">
      <div class="mb-3"><label class="form-label">Title *</label><input class="form-control" id="nf-title" required></div>
      <div class="mb-3"><label class="form-label">Content</label><textarea class="form-control" id="nf-content" rows="6"></textarea></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-danger d-none" id="nf-delete-btn">Delete</button>
      <button type="button" class="btn btn-outline-brut" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-honey">Save</button>
    </div>
  </form>
</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/notes.js"></script>
</body>
</html>
